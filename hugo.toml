baseURL = 'https://miloficios.es/'
locale = 'es-ES'
defaultContentLanguage = 'es'
title = 'Mil Oficios'
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term']

[params]
  autor = 'Tito Garlopa'
  descripcion = 'Aprende a hacerlo tú mismo: jardín, arreglos en casa, restauración de muebles y tu negocio, paso a paso y sin rodeos.'
