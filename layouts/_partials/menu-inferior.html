{{ $seccion := and (in site.Params.mainSections .Section) (site.GetPage .Section) }}
<nav class="menu-inf" aria-label="Menú">
  <a href="{{ "/" | relURL }}"{{ if .IsHome }} aria-current="page"{{ end }}>{{ partial "icono.html" "inicio" }}Inicio</a>
  <button type="button" data-secciones{{ with $seccion }} class="sec-{{ .Section }}" aria-current="true"{{ end }}>{{ partial "icono.html" "secciones" }}{{ with $seccion }}{{ .Title }}{{ else }}Secciones{{ end }}</button>
  <a class="central" href="{{ "herramientas/" | relURL }}"{{ if eq .Section "herramientas" }} aria-current="page"{{ end }}><span class="burbuja">{{ partial "icono.html" "martillo" }}</span>Herramientas</a>
  <button type="button" data-buscar>{{ partial "icono.html" "buscar" }}Buscar</button>
  <a href="{{ "tienda/" | relURL }}"{{ if eq .RelPermalink "/tienda/" }} aria-current="page"{{ end }}>{{ partial "icono.html" "tienda" }}Tienda</a>
</nav>
<dialog class="hoja-secciones" aria-label="Secciones">
  <div class="hoja-cab"><span class="grupo">Secciones</span><button class="atras" type="button" data-cerrar>Cerrar</button></div>
  <nav class="secciones hoja">{{ partial "secciones.html" . }}</nav>
</dialog>
