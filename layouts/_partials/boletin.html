{{ with site.Params.boletin }}
<section class="boletin">
  <h2>Un correo al mes</h2>
  <p>Las tareas del mes en el jardín y en casa, lo nuevo de la web y una herramienta útil. Nada más, y te das de baja cuando quieras.</p>
  <form class="boletin-form" method="post" action="{{ . }}">
    <div class="boletin-fila">
      <input type="email" name="EMAIL" required autocomplete="email" inputmode="email" placeholder="Tu correo" aria-label="Tu correo">
      <button class="boton" type="submit">Suscribirme</button>
    </div>
    <input type="text" name="email_address_check" value="" tabindex="-1" autocomplete="off" aria-hidden="true" class="boletin-trampa">
    <input type="hidden" name="locale" value="es">
    <label class="boletin-ok"><input type="checkbox" name="OPT_IN" value="1" required> Acepto la <a href="{{ "privacidad/" | relURL }}">política de privacidad</a></label>
    <p class="boletin-estado" aria-live="polite"></p>
  </form>
</section>
{{ end }}
