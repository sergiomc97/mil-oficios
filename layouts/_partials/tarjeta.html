<a class="tarjeta sec-{{ .Section }}" href="{{ .RelPermalink }}">
  <span class="tarjeta-texto">
    <span class="etiqueta">{{ .CurrentSection.Title }}</span>
    <span class="tarjeta-titulo">{{ .Title }}</span>
    {{ with .Params.tiempo }}<span class="meta">{{ . }}</span>{{ end }}
  </span>
  {{ with .Params.portada }}{{ with resources.Get . }}{{ with .Fill "240x240 webp q75 Smart" }}<img class="mini" src="{{ .RelPermalink }}" width="120" height="120" alt="" loading="lazy" decoding="async">{{ end }}{{ end }}{{ end }}
</a>
