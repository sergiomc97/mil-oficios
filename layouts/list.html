{{ define "main" }}
<div class="contenedor">
<section class="bloque seccion-cab">
  <div class="seccion-titulo">
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="entradilla">{{ . }}</p>{{ end }}
  </div>
  <div class="mosaico">{{ range $i, $p := .RegularPages }}{{ partial "baldosa.html" (dict "pagina" $p "ancha" (eq (mod $i 3) 0)) }}{{ else }}<p class="meta">Pronto habrá artículos aquí.</p>{{ end }}</div>
</section>
</div>
{{ end }}
