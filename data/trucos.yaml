- seccion: Arreglos
  texto: Una bolsa con vinagre atada al grifo quita la cal en una noche.
- seccion: Jardín
  texto: "Riega al amanecer: menos evaporación y menos hongos."
- seccion: Restauración
  texto: Lija siempre a favor de la veta. Siempre.
- seccion: Negocio
  texto: "¿Ticket en blanco? Mira el rollo: el papel térmico solo imprime por una cara."
- seccion: Negocio
  texto: Guarda los rollos de ticket lejos del sol y del calor, que estropean el papel térmico.
