name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      urls: ${{ steps.nuevas.outputs.urls }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - run: |
          wget -qO hugo.deb https://github.com/gohugoio/hugo/releases/download/v0.168.0/hugo_extended_0.168.0_linux-amd64.deb
          sudo dpkg -i hugo.deb
      - run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
        env:
          HUGO_PARAMS_WEATHERAPI: ${{ secrets.WEATHERAPI_KEY }}
      - run: npx -y pagefind@1.6.0 --site public
      - id: nuevas
        run: |
          hoy=$(date -u +%F)
          echo "urls=$(grep -oE "<loc>[^<]+</loc><lastmod>$hoy" public/sitemap.xml | sed -E 's#<loc>([^<]+)</loc>.*#"\1"#' | paste -sd, -)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - if: needs.build.outputs.urls != ''
        continue-on-error: true
        run: |
          curl -sS -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"miloficios.es","key":"85739fa4e7bc402578a962304a93f0db","keyLocation":"https://miloficios.es/85739fa4e7bc402578a962304a93f0db.txt","urlList":[${{ needs.build.outputs.urls }}]}'
