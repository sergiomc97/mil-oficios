name: Worker

on:
  push:
    branches: [main]
    paths: [worker/**]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: cuenta
        env:
          TOKEN: ${{ secrets.CLOUDFLARE }}
        run: |
          curl -s -H "Authorization: Bearer $TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -c '{success, errors, status: .result.status}'
          echo "id=$(curl -s -H "Authorization: Bearer $TOKEN" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')" >> "$GITHUB_OUTPUT"
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE }}
          accountId: ${{ steps.cuenta.outputs.id }}
          workingDirectory: worker
          secrets: GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI }}
