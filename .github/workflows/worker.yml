name: Worker

on:
  push:
    branches: [main]
    paths: [worker/**]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE }}
          workingDirectory: worker
          secrets: GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI }}
