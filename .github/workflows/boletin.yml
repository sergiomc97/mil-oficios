name: Boletín

on:
  schedule:
    - cron: "17 7 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  borrador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          wget -qO hugo.deb https://github.com/gohugoio/hugo/releases/download/v0.168.0/hugo_extended_0.168.0_linux-amd64.deb
          wget -qO hugo.sha https://github.com/gohugoio/hugo/releases/download/v0.168.0/hugo_0.168.0_checksums.txt
          grep ' hugo_extended_0.168.0_linux-amd64.deb$' hugo.sha | sed 's/ hugo_extended_0.168.0_linux-amd64.deb$/ hugo.deb/' | sha256sum -c -
          sudo dpkg -i hugo.deb
      - run: hugo --baseURL "https://miloficios.es/" -d boletin-build
      - run: python3 scripts/boletin.py boletin-build/boletin-correo/index.html
        env:
          BREVO_KEY: ${{ secrets.SENDER_TOKEN }}
